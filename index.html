<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BooRadly's personal library of games, apps, and data sets."><meta name="theme-color" content="#101114">
  <title>BooRadly — Project Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <main class="library-shell">
    <aside class="library-nav">
      <a class="library-brand" href="#apps"><span>BR</span><strong>BooRadly</strong></a>
      <p class="nav-label">PROJECT LIBRARY</p>
      <nav aria-label="Project categories">
        <a data-category-link="games" href="#games"><span>⌘</span>Games <b data-count="games"></b></a>
        <a data-category-link="apps" href="#apps"><span>✦</span>Apps <b data-count="apps"></b></a>
        <a data-category-link="data" href="#data"><span>◫</span>Data Sets <b data-count="data"></b></a>
      </nav>
      <div class="nav-note"><p>MADE IN CHICAGO</p><a href="https://github.com/WodinOneEye">GitHub ↗</a></div>
    </aside>
    <section class="library-content" aria-live="polite">
      <header class="library-header"><div><p class="eyebrow" id="category-number">02 / APPS</p><h1 id="category-title">Apps</h1><p id="category-description">Interactive tools, visual stories, and useful experiments.</p></div><div class="header-status"><span></span><span id="project-count"></span> PROJECTS</div></header>
      <div class="featured-banner" id="featured-banner"></div>
      <div class="section-bar"><span id="section-label">AVAILABLE NOW</span><span>SELECT A CARD TO OPEN</span></div>
      <div class="project-cards" id="project-cards"></div>
    </section>
  </main>
  <script src="portal.js"></script>
